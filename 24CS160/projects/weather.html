<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weather App</title>
  <!-- React and ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function WeatherApp() {
      const [city, setCity] = React.useState("Erode");
      const [temp, setTemp] = React.useState(30);
      const [condition, setCondition] = React.useState("Sunny");

      const cardStyle = {
        fontFamily: "Arial, sans-serif",
        margin: "40px auto",
        padding: "20px",
        width: "300px",
        border: "2px solid #FF9800",
        borderRadius: "8px",
        backgroundColor: "#fff8e1",
        textAlign: "center",
        boxShadow: "0 4px 8px rgba(0,0,0,0.1)"
      };

      const buttonStyle = {
        padding: "8px 12px",
        margin: "5px",
        border: "none",
        borderRadius: "4px",
        cursor: "pointer",
        fontSize: "14px"
      };

      return (
        <div style={cardStyle}>
          <h2 style={{color:"#FF9800"}}>Weather App</h2>
          <p><strong>{city}</strong>: {temp}°C, {condition}</p>
          <div>
            <button style={{...buttonStyle, backgroundColor:"#4CAF50", color:"white"}} onClick={() => setTemp(temp + 1)}>Warmer</button>
            <button style={{...buttonStyle, backgroundColor:"#2196F3", color:"white"}} onClick={() => setTemp(temp - 1)}>Cooler</button>
          </div>
          <div style={{marginTop:"10px"}}>
            <button style={{...buttonStyle, backgroundColor:"#FFC107"}} onClick={() => setCondition("Sunny")}>Sunny</button>
            <button style={{...buttonStyle, backgroundColor:"#03A9F4", color:"white"}} onClick={() => setCondition("Rainy")}>Rainy</button>
            <button style={{...buttonStyle, backgroundColor:"#9C27B0", color:"white"}} onClick={() => setCondition("Cloudy")}>Cloudy</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<WeatherApp />);
  </script>
</body>
</html>
